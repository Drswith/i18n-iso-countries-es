name: Release

on: workflow_dispatch

# v1 is frozen. Publish the final 1.0.2 package manually; do not publish
# legacy tags automatically after the repository becomes i18n-cldr-territories.

jobs:
  release:
    if: github.ref_type == 'tag'
    uses: sxzz/workflows/.github/workflows/release.yml@main
    with:
      publish: true
    permissions:
      contents: write
      id-token: write
