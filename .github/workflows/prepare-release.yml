name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release type"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      sync_upstream:
        description: "Record the current upstream master as the release baseline"
        required: true
        default: false
        type: boolean

permissions:
  actions: write
  contents: write

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Update upstream baseline
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_UPSTREAM: ${{ inputs.sync_upstream }}
        run: |
          if [[ "$SYNC_UPSTREAM" != "true" ]]; then
            exit 0
          fi

          upstream_repository="michaelwittig/node-i18n-iso-countries"
          upstream_branch="master"
          upstream_commit="$(gh api "repos/$upstream_repository/git/ref/heads/$upstream_branch" --jq .object.sha)"
          upstream_version="$(
            gh api "repos/$upstream_repository/contents/package.json?ref=$upstream_branch" --jq .content |
              tr -d '\n' |
              base64 --decode |
              jq -r .version
          )"

          pnpm run upstream:set -- "$upstream_version" "$upstream_commit"
      - name: Check
        run: pnpm run check
      - name: Configure release identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Bump version, commit, tag, and push
        env:
          RELEASE: ${{ inputs.release }}
        run: pnpm exec bumpp --all --release "$RELEASE" --yes --push
      - name: Trigger package publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(git describe --tags --exact-match HEAD)"
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$tag"
